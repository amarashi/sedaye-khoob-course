<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <meta name="description" content="">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="/">
    <meta property="og:locale" content="fa_IR">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:url" content="/">
    <meta property="og:image" content="assets/design/hero-logo-cropped.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="assets/design/hero-logo-cropped.png">
    <script id="structured-data" type="application/ld+json"></script>
    <link rel="icon" href="data:,">
    <link rel="preload" as="image" href="assets/design/sedayekhubBG.webp" fetchpriority="high">
    <link rel="preload" as="image" href="assets/design/maestro-conductor.webp">
    <script>
      /* Apply the saved theme before first paint to avoid a light flash. */
      try { if (localStorage.getItem("sk-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (error) {}
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topnav" id="siteHeader" data-od-id="topnav">
      <div class="topnav-inner">
        <a class="brand" href="#top" aria-label="صدای خوب">
          <strong class="spectrum-text" data-content="page.siteName"></strong>
        </a>
        <nav class="nav-links" id="siteNav" aria-label="فهرست سایت">
          <a href="#course" data-content="navigation.links.course"></a>
          <a href="#curriculum" data-content="navigation.links.curriculum"></a>
          <a href="#studio" data-content="navigation.links.studio"></a>
          <a href="#testimonials" data-content="navigation.links.testimonials"></a>
          <a href="#contact" data-content="navigation.links.contactShort"></a>
        </nav>
        <a class="btn btn-gold btn-sm nav-cta" href="#checkout" data-content="navigation.cta"></a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="تغییر حالت تیره و روشن" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.6 13.2A8.4 8.4 0 1 1 10.8 3.4a6.8 6.8 0 0 0 9.8 9.8z"></path></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"></path></svg>
        </button>
        <button class="btn btn-secondary menu-toggle" type="button" aria-label="باز کردن فهرست" aria-controls="siteNav" aria-expanded="false">☰</button>
      </div>
    </header>

    <main id="content">
      <section class="hero" id="top" data-section data-od-id="hero">
        <div class="hero-spot" aria-hidden="true"></div>
        <div class="hero-texture" aria-hidden="true"></div>

        <div class="hero-cast" aria-hidden="true">
          <span class="hero-note hero-note--1" data-depth="2.4">♪</span>
          <span class="hero-note hero-note--2" data-depth="1.8">♫</span>
          <span class="hero-note hero-note--3" data-depth="2.9">♬</span>
          <span class="hero-note hero-note--4" data-depth="1.4">♩</span>
          <span class="hero-note hero-note--5" data-depth="2.1">♪</span>
          <span class="hero-note hero-note--6" data-depth="3.2">♫</span>
          <span class="hero-note hero-note--7" data-depth="1.6">♪</span>
        </div>

        <div class="hero-inner">
          <img class="hero-logo" data-anim="logo" data-depth="0.25" src="assets/design/sedayekhubBG.webp" width="1448" height="1086" alt="صدای خوب" fetchpriority="high">
          <div class="hero-copy">
            <h1 id="heroTitle" data-content="hero.title"></h1>
            <p class="lead hero-lead" data-anim="lead" data-content="hero.intro"></p>
            <div class="hero-cta" data-anim="cta">
              <a class="btn btn-gold btn-lg" href="#checkout" data-content="hero.primaryButton"></a>
              <a class="btn btn-ghost-night btn-lg btn-arrow" href="#curriculum" data-content="hero.secondaryButton"></a>
            </div>
            <div class="hero-stats" data-render-list="hero.stats"></div>
          </div>

          <div class="hero-orchestra" aria-hidden="true">
            <div class="orb orb--a" data-depth="1.5"><img src="assets/design/ostad-piano.webp" alt="" decoding="async"></div>
            <div class="orb orb--b" data-depth="2.1"><img src="assets/design/ostad-daf.webp" alt="" decoding="async"></div>
            <div class="orb orb--c" data-depth="1.2"><img src="assets/design/ostad-tar.webp" alt="" decoding="async"></div>
            <div class="orchestra-podium" data-depth="0.3"></div>
            <img class="hero-maestro" src="assets/design/maestro-conductor.webp" width="569" height="568" alt="" data-depth="0.7" decoding="async">
          </div>
        </div>
      </section>

      <section class="section" id="course" data-section data-od-id="course">
        <div class="container intro-split">
          <div data-reveal>
            <p class="eyebrow" data-content="course.eyebrow"></p>
            <h2 data-content="course.title"></h2>
            <p class="lead" style="margin-top: 20px;" data-content="course.body"></p>
            <div class="intro-cta">
              <a class="btn btn-primary" href="#checkout" data-content="course.primaryButton"></a>
            </div>
          </div>
          <aside class="course-card" data-reveal>
            <span class="badge badge-gold" data-content="course.cardKicker"></span>
            <h3 data-content="course.cardTitle"></h3>
            <div class="course-instruments" aria-label="تصویرهای سازهای دوره">
              <span class="course-instrument"><img src="assets/design/inst-piano.webp" width="436" height="405" alt="پیانو برای تمرین آکوردها" loading="lazy" decoding="async"></span>
              <span class="course-instrument"><img src="assets/design/inst-tar.webp" width="322" height="466" alt="تار برای تمرین فاصله‌ها" loading="lazy" decoding="async"></span>
              <span class="course-instrument"><img src="assets/design/inst-tombak.webp" width="263" height="328" alt="تنبک برای تمرین ریتم" loading="lazy" decoding="async"></span>
            </div>
            <ul class="checklist" data-render-list="studio.features"></ul>
          </aside>
        </div>
      </section>

      <section class="section" id="curriculum" data-section data-od-id="curriculum">
        <div class="container">
          <div style="max-width: 680px;" data-reveal>
            <p class="eyebrow" data-content="curriculum.eyebrow"></p>
            <h2 data-content="curriculum.title"></h2>
            <p class="lead" style="margin-top: 18px;" data-content="curriculum.intro"></p>
          </div>

          <div class="modgrid" aria-label="چهار محور اصلی دوره" data-render-list="curriculum.topics"></div>

          <div class="focus-stage" data-reveal>
            <div class="focus-steps" aria-label="ماژول‌های تئوری موسیقی" data-render-list="curriculum.steps"></div>
            <div class="lesson-panel">
              <div>
                <span class="meta" id="moduleMeta" data-content="curriculum.moduleKicker"></span>
                <h3 id="moduleTitle"></h3>
                <p class="lead" id="moduleText" style="font-size: 17px;"></p>
              </div>
              <div class="lesson-visual">
                <img id="moduleImage" src="assets/design/ostad-piano.webp" alt="">
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="studio" data-section data-od-id="method">
        <div class="container stack" style="gap: 56px;">
          <div style="max-width: 720px;" data-reveal>
            <p class="eyebrow" data-content="studio.eyebrow"></p>
            <h2 data-content="studio.title"></h2>
            <p class="lead" style="margin-top: 18px;" data-content="studio.body"></p>
          </div>
          <div class="grid-3" data-render-list="studio.featureCards"></div>
        </div>
      </section>

      <section class="section" id="outcomes" data-section data-od-id="outcomes">
        <div class="container grid-1-2">
          <div data-reveal>
            <p class="eyebrow" data-content="outcomes.eyebrow"></p>
            <h2 data-content="outcomes.title"></h2>
            <p class="lead" style="margin-top: 18px;" data-content="outcomes.intro"></p>
          </div>
          <div class="grid-3" data-render-list="outcomes.items"></div>
        </div>
      </section>

      <section class="section tband" id="testimonials" data-section data-od-id="testimonials">
        <div class="container">
          <div class="testimonial-heading" data-reveal>
            <p class="eyebrow" data-content="testimonials.eyebrow"></p>
            <h2 data-content="testimonials.title"></h2>
            <p class="lead" style="margin-top: 16px;" data-content="testimonials.intro"></p>
          </div>
          <div class="testimonial-carousel" aria-label="نظر هنرجوها" data-render-list="testimonials.items"></div>
        </div>
      </section>

      <section class="section" id="checkout" data-section data-od-id="checkout">
        <div class="container checkout-wrap">
          <aside class="checkout-card" data-reveal>
            <span class="badge badge-night" data-content="checkout.priceLabel"></span>
            <h2 data-content="checkout.courseTitle"></h2>
            <p data-content="checkout.body"></p>
            <ul class="checklist checklist-boxed" data-render-list="checkout.benefits"></ul>
            <p class="meta checkout-note" data-content="checkout.note"></p>
          </aside>

          <form class="form-card" id="registrationForm" data-checkout-form novalidate data-reveal>
            <p class="eyebrow" data-content="checkout.eyebrow"></p>
            <h2 data-content="checkout.title"></h2>
            <p class="lead" style="margin-top: 14px; margin-bottom: 28px;" data-content="checkout.formIntro"></p>

            <div class="field">
              <label for="fullName" data-content="checkout.form.fullNameLabel"></label>
              <input class="input" id="fullName" name="fullName" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="mobile" data-content="checkout.form.mobileLabel"></label>
              <input class="input" id="mobile" name="mobile" inputmode="tel" required>
            </div>
            <div class="field">
              <label for="email" data-content="checkout.form.emailLabel"></label>
              <input class="input" id="email" name="email" type="email" autocomplete="email">
            </div>
            <div class="field">
              <label for="question" data-content="checkout.form.questionLabel"></label>
              <textarea class="textarea" id="question" name="question" data-content-placeholder="checkout.form.questionPlaceholder"></textarea>
            </div>

            <button class="btn btn-gold btn-lg" type="submit" data-content="checkout.form.submitButton"></button>
            <div class="form-message" id="formMessage" data-checkout-status role="status" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </main>

    <footer class="pagefoot" id="contact" data-section data-od-id="footer">
      <div class="container">
        <div class="grid-2" data-reveal>
          <div>
            <p class="eyebrow" data-content="contact.eyebrow"></p>
            <h2 data-content="contact.title"></h2>
          </div>
          <p class="lead" data-content="contact.body"></p>
        </div>
        <div class="contact-grid" data-render-list="contact.methods"></div>
        <div class="footer-bottom">
          <span class="meta">© 2026 <span data-content="page.siteName"></span></span>
          <span class="meta" data-content="contact.note"></span>
        </div>
      </div>
    </footer>

    <script id="site-content" type="application/json"></script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
