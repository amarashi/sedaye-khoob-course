<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--color-surface); display: grid; gap: 14px; }
  .calli { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px 18px; display: grid; place-items: center; }
  .calli img { width: 72%; max-height: 70px; object-fit: contain; }
  .insts { display: flex; gap: 12px; justify-content: center; }
  .insts span { width: 74px; height: 64px; display: grid; place-items: center; background: var(--sky-50); border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
  .insts img { width: 80%; height: 80%; object-fit: contain; }
</style>
</head>
<body>
  <div class="calli"><img src="../assets/design/sedakonmaraAll.png" alt="صدا کن مرا"></div>
  <div class="insts">
    <span><img src="../assets/design/inst-piano.png" alt=""></span>
    <span><img src="../assets/design/inst-tar.png" alt=""></span>
    <span><img src="../assets/design/inst-tombak.png" alt=""></span>
    <span><img src="../assets/design/inst-violin.png" alt=""></span>
  </div>
</body>
</html>
