<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--color-surface); color: var(--color-ink); }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--color-border); padding: 12px 0; }
  .row:last-child { border-bottom: 0; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); min-width: 96px; direction: ltr; text-align: left; }
  .d { font-family: var(--font-display); font-size: 52px; font-weight: 760; line-height: 1.05; }
  .h1s { font-size: 40px; font-weight: 640; }
  .h2s { font-size: 30px; font-weight: 540; }
  .h3s { font-size: 22px; font-weight: 640; }
</style>
</head>
<body>
  <div class="row"><span class="tag">display / 760</span><span class="d">صدای خوب</span></div>
  <div class="row"><span class="tag">h1 / 640</span><span class="h1s">تئوری موسیقی</span></div>
  <div class="row"><span class="tag">h2 / 540</span><span class="h2s">نقشه‌ای از تئوری</span></div>
  <div class="row"><span class="tag">h3 / 640</span><span class="h3s">نت‌ها را مثل مختصات بخوانید</span></div>
</body>
</html>
