<!-- @dsCard group="Colors" viewport="700x150" name="Ink & surfaces" subtitle="Navy neutrals over sky-paper surfaces" -->
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); display: grid; gap: 14px; }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .chip { display: flex; flex-direction: column; gap: 6px; }
  .sw { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); text-align: center; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="chip"><div class="sw" style="background:var(--ink-900)"></div><span class="lbl">ink-900</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-800)"></div><span class="lbl">800</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-700)"></div><span class="lbl">700</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-500)"></div><span class="lbl">500</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-400)"></div><span class="lbl">400</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-200)"></div><span class="lbl">200</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-100)"></div><span class="lbl">100</span></div>
  </div>
  <div class="ramp">
    <div class="chip"><div class="sw" style="background:var(--paper)"></div><span class="lbl">paper</span></div>
    <div class="chip"><div class="sw" style="background:var(--sky-50)"></div><span class="lbl">sky-50</span></div>
    <div class="chip"><div class="sw" style="background:var(--sky-100)"></div><span class="lbl">sky-100</span></div>
    <div class="chip"><div class="sw" style="background:var(--sky-200)"></div><span class="lbl">sky-200</span></div>
    <div class="chip"><div class="sw" style="background:var(--color-night)"></div><span class="lbl">night</span></div>
    <div class="chip"><div class="sw" style="background:var(--color-night-2)"></div><span class="lbl">night-2</span></div>
    <div class="chip"><div class="sw" style="background:var(--color-border)"></div><span class="lbl">border</span></div>
  </div>
</body>
</html>
