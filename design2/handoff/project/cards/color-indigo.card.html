<!-- @dsCard group="Colors" viewport="700x150" name="Indigo — primary" subtitle="The eighth-note blue; primary actions & focus" -->
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); }
  .ramp { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .chip { display: flex; flex-direction: column; gap: 6px; }
  .sw { height: 60px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); text-align: center; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="chip"><div class="sw" style="background:var(--indigo-50)"></div><span class="lbl">50</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-100)"></div><span class="lbl">100</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-200)"></div><span class="lbl">200</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-400)"></div><span class="lbl">400</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-500)"></div><span class="lbl">500</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-600)"></div><span class="lbl">600 ◆</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-700)"></div><span class="lbl">700</span></div>
    <div class="chip"><div class="sw" style="background:var(--indigo-900)"></div><span class="lbl">900</span></div>
  </div>
</body>
</html>
