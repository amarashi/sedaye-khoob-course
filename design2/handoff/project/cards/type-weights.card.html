<!-- @dsCard group="Type" viewport="700x160" name="Weight axis & gradient" subtitle="Estedad 300–860 + the spectrum-text treatment" -->
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--color-surface); color: var(--color-ink); display: grid; gap: 18px; }
  .weights { display: flex; flex-wrap: wrap; gap: 22px; align-items: baseline; }
  .w { font-size: 30px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); display: block; direction: ltr; text-align: center; margin-top: 2px; }
  .grad { font-family: var(--font-display); font-size: 46px; font-weight: 800; }
</style>
</head>
<body>
  <div class="weights">
    <span><span class="w" style="font-weight:300">موسیقی</span><span class="cap">300</span></span>
    <span><span class="w" style="font-weight:420">موسیقی</span><span class="cap">420</span></span>
    <span><span class="w" style="font-weight:540">موسیقی</span><span class="cap">540</span></span>
    <span><span class="w" style="font-weight:640">موسیقی</span><span class="cap">640</span></span>
    <span><span class="w" style="font-weight:760">موسیقی</span><span class="cap">760</span></span>
    <span><span class="w" style="font-weight:860">موسیقی</span><span class="cap">860</span></span>
  </div>
  <span class="grad spectrum-text">صدای تو خوب است</span>
</body>
</html>
