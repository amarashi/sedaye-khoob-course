<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--color-surface); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .cell { aspect-ratio: 1; border-radius: var(--radius-md); display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, var(--sky-50), var(--sky-200));
    border: 1px solid var(--color-border); }
  .cell img { width: 92%; height: 92%; object-fit: contain; filter: drop-shadow(0 10px 12px color-mix(in oklch, var(--ink-900) 14%, transparent)); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><img src="../assets/design/ostad-piano.png" alt=""></div>
    <div class="cell"><img src="../assets/design/ostad-tar.png" alt=""></div>
    <div class="cell"><img src="../assets/design/ostad-guitar.png" alt=""></div>
    <div class="cell"><img src="../assets/design/ostad-tombak.png" alt=""></div>
    <div class="cell"><img src="../assets/design/ostad-daf.png" alt=""></div>
    <div class="cell"><img src="../assets/design/maestro-conductor.png" alt=""></div>
  </div>
</body>
</html>
