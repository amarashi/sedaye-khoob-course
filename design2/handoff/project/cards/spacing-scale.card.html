<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4 → 104px rhythm" -->
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--color-surface); display: flex; align-items: flex-end; gap: 18px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 30px; background: var(--brand-spectrum); border-radius: 6px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-muted); }
</style>
</head>
<body>
  <div class="step"><div class="bar" style="height:4px"></div><span class="lbl">2xs·4</span></div>
  <div class="step"><div class="bar" style="height:8px"></div><span class="lbl">xs·8</span></div>
  <div class="step"><div class="bar" style="height:12px"></div><span class="lbl">sm·12</span></div>
  <div class="step"><div class="bar" style="height:20px"></div><span class="lbl">md·20</span></div>
  <div class="step"><div class="bar" style="height:32px"></div><span class="lbl">lg·32</span></div>
  <div class="step"><div class="bar" style="height:56px"></div><span class="lbl">xl·56</span></div>
  <div class="step"><div class="bar" style="height:90px"></div><span class="lbl">2xl·104</span></div>
</body>
</html>
